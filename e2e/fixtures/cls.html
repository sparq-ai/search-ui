<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>e2e cls</title>
  <script>
    // Buffered layout-shift collection, started before anything renders.
    window.__cls = 0;
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (entry) {
        if (!entry.hadRecentInput) window.__cls += entry.value;
      });
    }).observe({ type: 'layout-shift', buffered: true });
    window.__SPARQ_MOCK_DELAY__ = 400;
  </script>
  <script src="/e2e/fixtures/mock-data.js"></script>
  <script src="/packages/components/dist/sparq.js" defer></script>
  <style>
    .result-card { height: 60px; border: 1px solid #ddd; margin-bottom: 8px; padding: 8px; box-sizing: border-box; }
    /* Documented CWV pattern (ARCHITECTURE §17): on JS-only pages, reserve
       widget space BEFORE the deferred script upgrades the elements —
       first paint can beat script execution. SSR pages don't need this. */
    sparq-searchbox:not(:defined) { display: block; min-height: 44px; }
    sparq-pagination:not(:defined) { display: block; min-height: 46px; }
    sparq-items:not(:defined) { display: block; min-height: 544px; } /* 8 × 68px rows */
  </style>
</head>
<body>
  <h1>Results</h1>
  <sparq-search collection="products" api-host="mock:" items-per-page="8">
    <sparq-searchbox placeholder="Search…"></sparq-searchbox>
    <sparq-items>
      <template><article class="result-card"><h3>{{name}}</h3><p>{{brand}}</p></article></template>
    </sparq-items>
    <sparq-pagination></sparq-pagination>
  </sparq-search>
  <footer style="height: 80px;">footer content</footer>
</body>
</html>
